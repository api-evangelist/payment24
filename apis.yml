name: Payment24
description: Payment24 is a white-label payment platform specializing in fuel and fleet payment
  solutions for oil companies, banks, and retailers, primarily across Africa. Its technology lets
  clients design and launch branded payment products under their own name — fuel payments and mobile
  payments, loyalty and rewards, POS terminals, electronic vouchers, B2B and B2C prepaid and
  store-account cards, EV charging payments, and wet-stock and fuel-in-tank management — alongside
  banking-grade issuing, acquiring, card management, and merchant management, plus fleet fuel
  management and telematics. Payment24 operates as a technology partner rather than a public
  self-serve API provider, so it publishes no open developer portal or API documentation.
